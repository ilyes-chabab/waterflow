route:
  receiver: default
  group_by: ["alertname"]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h

receivers:
  - name: default
    # host.docker.internal : depuis le conteneur alertmanager, joint le serveur
    # toast_notifier.py qui tourne sur la machine hote (scripts/toast_notifier.py),
    # port 5001. Necessite que ce script tourne pour recevoir les notifications.
    webhook_configs:
      - url: "http://host.docker.internal:5001/webhook"
        send_resolved: true
